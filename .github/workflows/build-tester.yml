name: Build Nene Tester

on:
  workflow_dispatch:
  push:
    tags:
      - "tester-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: nene_tester

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath ../windows.zip `
            -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: nene_tester/windows.zip


  build-android:
    name: Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nene_tester

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: nene_tester/android.apk


  build-ios:
    name: iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: nene_tester

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Rename IPA
        run: cp build/ios/ipa/*.ipa ../ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: nene_tester/ios.ipa


  build-macos:
    name: macOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: nene_tester

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Compress
        run: |
          cd build/macos/Build/Products/Release
          zip -9 -r ../../../../../macos.zip nene_tester.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: nene_tester/macos.zip


  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nene_tester

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../linux.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: nene_tester/linux.tar.gz


  release:
    name: Create Release
    needs:
      - build-windows
      - build-android
      - build-ios
      - build-macos
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: release

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/windows.zip
            release/android.apk
            release/ios.ipa
            release/macos.zip
            release/linux.tar.gz