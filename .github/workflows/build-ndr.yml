name: Build Nene Desktop Runtime (live)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nene_desktop_runtime

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress directly in build folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "build/windows/windows.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: nene_desktop_runtime/build/windows/windows.zip
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nene_desktop_runtime

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Compress macOS app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -y -r -9 macos.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: nene_desktop_runtime/build/macos/Build/Products/Release/macos.zip
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nene_desktop_runtime

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev \
            mpv

          # Alias webkit2gtk-4.1 to 4.0 so plugins looking for either version pass pkg-config
          PC_DIR=$(pkg-config --variable pc_path pkg-config | cut -d ':' -f 1)
          if [ ! -f "$PC_DIR/webkit2gtk-4.0.pc" ] && [ -f "/usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc" ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
            sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.0.pc
          fi

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Fix quickjs_engine missing FLUTTER_PLUGIN_EXPORT on Linux
        run: |
          find "$HOME/.pub-cache" -name "quickjs_engine_plugin.h" -exec sed -i \
            's/#include <flutter_linux\/flutter_linux.h>/#include <flutter_linux\/flutter_linux.h>\n\n#ifndef FLUTTER_PLUGIN_EXPORT\n#ifdef FLUTTER_PLUGIN_IMPL\n#define FLUTTER_PLUGIN_EXPORT __attribute__((visibility("default")))\n#else\n#define FLUTTER_PLUGIN_EXPORT\n#endif\n#endif/' {} +

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux bundle
        run: |
          tar -czf build/linux/linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: nene_desktop_runtime/build/linux/linux.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-android
      - build-ios
      - build-macos
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/windows.zip
            release/android-apk.zip
            release/ios.ipa
            release/macos.zip
            release/linux.tar.gz