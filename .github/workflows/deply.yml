name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus and Flutter Tester
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build the Flutter web tester
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web
        working-directory: nene_tester
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        working-directory: nene_tester
        run: flutter pub get

      - name: Build Flutter web
        working-directory: nene_tester
        run: flutter build web --release --base-href /neneui/tester/

      # Install and build Docusaurus
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Docusaurus dependencies
        working-directory: nenedocs
        run: bun install --frozen-lockfile

      - name: Build Docusaurus
        working-directory: nenedocs
        run: bun run build

      # Embed Flutter inside the Docusaurus deployment
      - name: Add Flutter tester to website
        run: |
          mkdir -p nenedocs/build/tester
          cp -a nene_tester/build/web/. nenedocs/build/tester/

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nenedocs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
