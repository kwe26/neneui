name: neneui_render
description: "Render NeneUI interface definitions as native Flutter widgets."
version: 0.0.3
homepage: https://github.com/kwe26/neneui
repository: https://github.com/kwe26/neneui

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  flutter_svg: ^2.3.0
  http: ^1.6.0
  shadcn_flutter: ^0.0.52
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

